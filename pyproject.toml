[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "game-npc-agent"
version = "0.3.0"
description = "中文 NPC 对话、任务状态与可追溯知识检索示例"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2"]
live = ["openai>=2,<3"]
pdf = ["pypdf>=6,<7"]
vector = ["chromadb>=1.2,<2", "openai>=2,<3"]
dev = ["build>=1.3,<2", "ruff>=0.14,<1"]

[project.scripts]
game-npc = "game_npc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_npc = ["assets/prompts/*.txt", "assets/knowledge/*.txt", "assets/knowledge/*.pdf", "assets/npcs/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
