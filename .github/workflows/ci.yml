name: Build and test
on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }} --extra dev --extra pdf
      - run: uv run --no-sync ruff check src tests app.py
      - run: uv run --no-sync ruff format --check src tests app.py
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --no-sync game-npc --state-dir .runtime ingest
      - run: uv run --no-sync game-npc --state-dir .runtime chat "NPC 对话规范"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12 --extra ui --extra live --extra pdf --extra dev
      - run: uv run --no-sync python -m unittest discover -s tests -v
